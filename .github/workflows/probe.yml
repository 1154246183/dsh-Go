name: Probe (ubuntu analyze)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: echo
        run: |
          echo "ubuntu runner works"
          uname -a
          df -h / | tail -1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: analyze
        working-directory: app
        run: flutter analyze --no-pub
